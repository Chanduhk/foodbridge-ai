version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: foodbridge_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodbridge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodbridge_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-foodbridge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge_user -d foodbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
